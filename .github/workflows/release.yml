name: Auto Publish Mod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to confirm"
        required: true
        type: string

concurrency:
  group: auto-publish-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.branch_check.outputs.target_branch }}
    steps:
      - name: Resolve trigger input
        id: branch_check
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$INPUT_CONFIRM" != "RELEASE" ]]; then
            echo "Manual confirmation failed. Type RELEASE to confirm."
            exit 1
          fi
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build Mod
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      mod_name: ${{ steps.meta.outputs.mod_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      changelog: ${{ steps.meta.outputs.changelog }}
      loader: ${{ steps.meta.outputs.loader }}
      minecraft_version: ${{ steps.meta.outputs.minecraft_version }}
      java_version: ${{ steps.meta.outputs.java_version }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Read project metadata
        id: meta
        shell: bash
        run: |
          # Read gradle.properties
          mod_name=$(awk -F= '/^mod_name=/{print $2}' gradle.properties | tr -d '\r')
          mod_version=$(awk -F= '/^mod_version=/{print $2}' gradle.properties | tr -d '\r')
          minecraft_version=$(awk -F= '/^minecraft_version=/{print $2}' gradle.properties | tr -d '\r')

          # Major version for changelog filename
          mod_major_version="${mod_version%%.*}"
          changelog_file="CHANGELOGS/${minecraft_version}-${mod_major_version}.x.md"

          if [[ ! -f "$changelog_file" ]]; then
            echo "Missing changelog file: $changelog_file"
            exit 1
          fi

          # Extract only current version changelog
          changelog=$(awk -v version="$mod_version" '
            $0 ~ "# " version {flag=1; next}
            /^#/ {flag=0}
            flag {print}
          ' "$changelog_file")

          if [[ -z "$changelog" ]]; then
            echo "No changelog entry found for version $mod_version in $changelog_file"
            exit 1
          fi

          # Detect loader
          if grep -q 'id("net.neoforged.moddev")' build.gradle.kts; then
            loader="neoforge"
          elif grep -q 'id("net.minecraftforge.gradle")' build.gradle.kts; then
            loader="forge"
          else
            loader="neoforge"
          fi

          # Detect java version
          java_version=$(grep -oE 'JavaLanguageVersion\.of\([0-9]+\)' build.gradle.kts | grep -oE '[0-9]+' || echo 21)

          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=${minecraft_version}-${mod_version}" >> "$GITHUB_OUTPUT"
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        shell: bash
        run: |
          # Check if copyJar exists
          if ./gradlew tasks --all --console=plain | grep -qE '^copyJar\s'; then
            echo "Excluding copyJar task"
            EXCLUDE_ARGS="-x copyJar"
          else
            EXCLUDE_ARGS=""
          fi

          ./gradlew clean build $EXCLUDE_ARGS --console=plain
        env:
          CI: true
          BUILD_VERSION: ${{ steps.meta.outputs.release_tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: build/libs/*.jar

  publish-curseforge:
    name: Publish to CurseForge
    needs: build
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.TOKEN_CURSEFORGE }}
      CURSEFORGE_PROJECT_ID: ${{ vars.curseforge_id }}  # numeric ID (e.g., 1135181)
    steps:
      - name: Skip if no CurseForge token or project ID
        shell: bash
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" || -z "$CURSEFORGE_PROJECT_ID" ]]; then
            echo "No CurseForge token or project ID configured. Skipping."
            exit 0
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: ${{ needs.build.outputs.mod_name }} - ${{ needs.build.outputs.release_tag }}
          version: ${{ needs.build.outputs.release_tag }}
          files: build/libs/*.jar
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: ${{ needs.build.outputs.loader }}
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          java: ${{ needs.build.outputs.java_version }}
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.TOKEN_MODRINTH }}
      MODRINTH_PROJECT_ID: ${{ vars.modrinth_id }}  # UUID or numeric ID (e.g., tfpHINm8)
    steps:
      - name: Skip if no Modrinth token or project ID
        shell: bash
        run: |
          if [[ -z "$MODRINTH_TOKEN" || -z "$MODRINTH_PROJECT_ID" ]]; then
            echo "No Modrinth token or project ID configured. Skipping."
            exit 0
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: ${{ needs.build.outputs.mod_name }} - ${{ needs.build.outputs.release_tag }}
          version: ${{ needs.build.outputs.release_tag }}
          files: build/libs/*.jar
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: ${{ needs.build.outputs.loader }}
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          java: ${{ needs.build.outputs.java_version }}
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to confirm"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      changelog: ${{ steps.meta.outputs.changelog }}
      mod_name: ${{ steps.meta.outputs.mod_name }}
      minecraft_version: ${{ steps.meta.outputs.minecraft_version }}
      curseforge_id: ${{ steps.meta.outputs.curseforge_id }}
      modrinth_id: ${{ steps.meta.outputs.modrinth_id }}

    steps:
      - name: Confirm release
        run: |
          if [[ "${{ inputs.confirm }}" != "RELEASE" ]]; then
            echo "You must type RELEASE"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Read metadata + changelog
        id: meta
        shell: bash
        run: |
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mod_name=$(grep '^mod_name=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mod_id=$(grep '^mod_id=' gradle.properties | cut -d= -f2 | tr -d '\r')
          curseforge_id=$(grep '^curseforge_id=' gradle.properties | cut -d= -f2 | tr -d '\r')
          modrinth_id=$(grep '^modrinth_id=' gradle.properties | cut -d= -f2 | tr -d '\r')

          tag="${minecraft_version}-${mod_version}"

          major=$(echo "$mod_version" | cut -d. -f1)
          changelog_file="CHANGELOGS/${minecraft_version}-${major}.x.md"

          if [[ ! -f "$changelog_file" ]]; then
            echo "Missing changelog file: $changelog_file"
            exit 1
          fi

          changelog=$(awk -v ver="$mod_version" '
            $0 ~ "^# "ver"$" {found=1; next}
            found && /^# [0-9]/ {exit}
            found {print}
          ' "$changelog_file")

          if [[ -z "$changelog" ]]; then
            echo "No changelog found for version $mod_version"
            exit 1
          fi

          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "mod_name=$mod_name" >> $GITHUB_OUTPUT
          echo "minecraft_version=$minecraft_version" >> $GITHUB_OUTPUT
          echo "mod_id=$mod_id" >> $GITHUB_OUTPUT
          echo "curseforge_id=$curseforge_id" >> $GITHUB_OUTPUT
          echo "modrinth_id=$modrinth_id" >> $GITHUB_OUTPUT
          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/libs/${{ steps.meta.outputs.mod_id }}-${{ steps.meta.outputs.tag }}.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod

      - name: Publish to CurseForge
        if: ${{ secrets.TOKEN_CURSEFORGE != '' && needs.build.outputs.curseforge_id != '' }}
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          files: "build/libs/${{ needs.build.outputs.mod_id }}-${{ needs.build.outputs.tag }}.jar"
          name: ${{ needs.build.outputs.mod_name }}
          version: ${{ needs.build.outputs.tag }}
          changelog: ${{ needs.build.outputs.changelog }}
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          loaders: "neoforge"
          environments: "client,server"
          curseforge-id: ${{ needs.build.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.TOKEN_CURSEFORGE }}

      - name: Publish to Modrinth
        if: ${{ secrets.TOKEN_MODRINTH != '' && needs.build.outputs.modrinth_id != '' }}
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          files: "build/libs/${{ needs.build.outputs.mod_id }}-${{ needs.build.outputs.tag }}.jar"
          name: ${{ needs.build.outputs.mod_name }}
          version: ${{ needs.build.outputs.tag }}
          changelog: ${{ needs.build.outputs.changelog }}
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          loaders: "neoforge"
          environments: "client,server"
          modrinth-id: ${{ needs.build.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.TOKEN_MODRINTH }}
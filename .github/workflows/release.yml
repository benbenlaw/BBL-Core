name: Auto Publish Mod

on:
  push:
    branches:
      - '26.1.x'

concurrency:
  group: auto-publish-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest
    outputs:
      mod_name: ${{ steps.meta.outputs.mod_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      changelog: ${{ steps.meta.outputs.changelog }}
      loader: ${{ steps.meta.outputs.loader }}
      minecraft_version: ${{ steps.meta.outputs.minecraft_version }}
      java_version: ${{ steps.meta.outputs.java_version }}
      curseforge_id: ${{ steps.meta.outputs.curseforge_id }}
      modrinth_id: ${{ steps.meta.outputs.modrinth_id }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project metadata
        id: meta
        shell: bash
        run: |
          # 1. Capture the branch name
          current_branch="${GITHUB_REF##*/}"
          
          # 2. Extract values from gradle.properties
          minecraft_version=$(awk -F= '/^minecraft_version=/{print $2}' gradle.properties | xargs)
          minecraft_version_range=$(awk -F= '/^minecraft_version_range=/{print $2}' gradle.properties | xargs)
          mod_name=$(awk -F= '/^mod_name=/{print $2}' gradle.properties | xargs)
          mod_version=$(awk -F= '/^mod_version=/{print $2}' gradle.properties | xargs)
          curseforge_id=$(awk -F= '/^curseforge_id=/{print $2}' gradle.properties | xargs)
          modrinth_id=$(awk -F= '/^modrinth_id=/{print $2}' gradle.properties | xargs)
          
          # 3. Wildcard Comparison
          # This allows branch '26.1.x' to match '26.1.2'
          if [[ "$minecraft_version" != $current_branch ]]; then
            echo "Branch $current_branch does not match MC version $minecraft_version. Skipping."
            exit 0
          fi
          
          # 4. Handle Changelog (Path: CHANGELOGS/26.1.x-12.x.md)
          mod_major_version="${mod_version%%.*}"
          changelog_file="CHANGELOGS/${current_branch}-${mod_major_version}.x.md"
          
          if [[ ! -f "$changelog_file" ]]; then
            echo "::error::Missing changelog file: $changelog_file"
            exit 1
          fi
          
          changelog_body=$(awk -v version="$mod_version" '
            $0 ~ "# " version {flag=1; next}
            /^#/ {flag=0}
            flag {print}
          ' "$changelog_file")
          
          if [[ -z "$changelog_body" ]]; then
            echo "::error::No entry for # $mod_version in $changelog_file"
            exit 1
          fi
          
          # 5. Safe Java Detection
          # Falls back to 21 if the build.gradle.kts check fails
          java_val=$(grep -oE 'JavaLanguageVersion\.of\([0-9]+\)' build.gradle.kts | grep -oE '[0-9]+' | head -1)
          java_version=${java_val:-21}
          
          # 6. Loader Detection
          loader="neoforge"
          if grep -q 'net.minecraftforge.gradle' build.gradle.kts; then loader="forge"; fi
          
          # 7. Outputs
          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=${minecraft_version}-${mod_version}" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version_range=$minecraft_version_range" >> "$GITHUB_OUTPUT"
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"
          echo "curseforge_id=$curseforge_id" >> "$GITHUB_OUTPUT"
          echo "modrinth_id=$modrinth_id" >> "$GITHUB_OUTPUT"
          
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "# $mod_version" >> "$GITHUB_OUTPUT"
          echo "$changelog_body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --console=plain
        env:
          CI: true
          BUILD_VERSION: ${{ steps.meta.outputs.release_tag }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
          PUBLISH: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: build/libs/*.jar

  publish-curseforge:
    name: Publish to CurseForge
    needs: build
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.TOKEN_CURSEFORGE }}
    steps:
      - name: Skip if no CurseForge token
        shell: bash
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "No CurseForge token configured. Skipping."
            exit 0
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: ${{ needs.build.outputs.mod_name }} - ${{ needs.build.outputs.release_tag }}
          version: ${{ needs.build.outputs.release_tag }}
          files: build/libs/*.jar
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: ${{ needs.build.outputs.loader }}
          game-versions: ${{ needs.build.outputs.minecraft_version_range }}
          java: 25
          curseforge-id: ${{ needs.build.outputs.curseforge_id }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.TOKEN_MODRINTH }}
    steps:
      - name: Skip if no Modrinth token
        shell: bash
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "No Modrinth token configured. Skipping."
            exit 0
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/libs

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: ${{ needs.build.outputs.mod_name }} - ${{ needs.build.outputs.release_tag }}
          version: ${{ needs.build.outputs.release_tag }}
          files: build/libs/*.jar
          changelog: ${{ needs.build.outputs.changelog }}
          loaders: ${{ needs.build.outputs.loader }}
          game-versions: ${{ needs.build.outputs.minecraft_version_range }}
          java: 25
          modrinth-id: ${{ needs.build.outputs.modrinth_id }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to confirm"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      changelog: ${{ steps.meta.outputs.changelog }}
      mod_name: ${{ steps.meta.outputs.mod_name }}
      minecraft_version: ${{ steps.meta.outputs.minecraft_version }}

    steps:
      - name: Confirm release
        run: |
          if [[ "${{ inputs.confirm }}" != "RELEASE" ]]; then
            echo "You must type RELEASE"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Read metadata + changelog
        id: meta
        shell: bash
        run: |
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mod_name=$(grep '^mod_name=' gradle.properties | cut -d= -f2 | tr -d '\r')

          tag="${minecraft_version}-${mod_version}"

          major=$(echo "$mod_version" | cut -d. -f1)
          changelog_file="CHANGELOGS/${minecraft_version}-${major}.x.md"

          if [[ ! -f "$changelog_file" ]]; then
            echo "Missing changelog file: $changelog_file"
            exit 1
          fi

          changelog=$(awk -v ver="$mod_version" '
            $0 ~ "^# "ver"$" {found=1; next}
            found && /^# [0-9]/ {exit}
            found {print}
          ' "$changelog_file")

          if [[ -z "$changelog" ]]; then
            echo "No changelog found for version $mod_version"
            exit 1
          fi

          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "mod_name=$mod_name" >> $GITHUB_OUTPUT
          echo "minecraft_version=$minecraft_version" >> $GITHUB_OUTPUT

          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        # We pass -P flags to define the properties Gradle's build script expects.
        # This prevents "unknown property" errors during the configuration phase.
        run: |
          ./gradlew build \
            -Pmodrinth_id=${{ vars.MODRINTH_PROJECT_ID || 'unused' }} \
            -Pcurseforge_id=${{ vars.CURSEFORGE_PROJECT_ID || 'unused' }} \
            -Prelease_type=release \
            -Prelease_versions=${{ steps.meta.outputs.minecraft_version }} \
            -Pchangelog_text="Internal Build"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/libs/bblcore-${{ steps.meta.outputs.tag }}.jar

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: mod

      - name: Prepare publish flags
        id: publish_flags
        run: |
          if [[ -n "${{ secrets.TOKEN_CURSEFORGE }}" && -n "${{ vars.CURSEFORGE_PROJECT_ID }}" ]]; then
            echo "publish_cf=true" >> $GITHUB_OUTPUT
          else
            echo "publish_cf=false" >> $GITHUB_OUTPUT
          fi

          if [[ -n "${{ secrets.TOKEN_MODRINTH }}" && -n "${{ vars.MODRINTH_PROJECT_ID }}" ]]; then
            echo "publish_mr=true" >> $GITHUB_OUTPUT
          else
            echo "publish_mr=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to CurseForge
        if: ${{ steps.publish_flags.outputs.publish_cf == 'true' }}
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          # Note: download-artifact flattens the path.
          # The file is in the root of the workspace now.
          files: "bblcore-${{ needs.build.outputs.tag }}.jar"
          name: ${{ needs.build.outputs.mod_name }}
          version: ${{ needs.build.outputs.tag }}
          changelog: ${{ needs.build.outputs.changelog }}
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          loaders: "neoforge"
          environments: "client,server"
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.TOKEN_CURSEFORGE }}

      - name: Publish to Modrinth
        if: ${{ steps.publish_flags.outputs.publish_mr == 'true' }}
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          files: "bblcore-${{ needs.build.outputs.tag }}.jar"
          name: ${{ needs.build.outputs.mod_name }}
          version: ${{ needs.build.outputs.tag }}
          changelog: ${{ needs.build.outputs.changelog }}
          game-versions: ${{ needs.build.outputs.minecraft_version }}
          loaders: "neoforge"
          environments: "client,server"
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.TOKEN_MODRINTH }}